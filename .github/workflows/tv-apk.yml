name: TV app (APK)

# Builds the Android TV / Google TV wrapper in tv/android and attaches the APK
# to the run (Actions → this run → Artifacts → yardobs-tv). Install it on the
# TV with `adb install -r` — see tv/README.md.

on:
  push:
    paths:
      - 'tv/**'
      - 'package.json'
      - '.github/workflows/tv-apk.yml'
  pull_request:
    paths:
      - 'tv/**'
      - '.github/workflows/tv-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already has the Android SDK (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p tv/android assembleDebug --no-daemon

      - name: Name the APK with its version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp tv/android/app/build/outputs/apk/debug/app-debug.apk "yardobs-tv-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: yardobs-tv
          path: yardobs-tv-*.apk
          if-no-files-found: error
